# Assistant-reviewed against bundled catalogue titles and bullet points, not human labels.
# Cases and top-three expectations authored before this focused evaluation run.
# Unknown products remain unreviewed; original ESCI labels are preserved separately.
- &sony
  case_id: sony-model
  target_product: Sony ZV-E10
  query: Sony ZV-E10
  required_top_k: 3
  required_modes: [text, hybrid]
  notes: >-
    Seek the ZV-E10 camera. Body and kit listings are acceptable; no colour or
    condition restriction is requested. Straps mentioning compatibility are irrelevant.
  judgements:
    B09BBKVMCD: relevant
    B09BBMQKSR: relevant
    B06XG9T25F: irrelevant
    B071DZNCY5: irrelevant
    B07RJLLR45: irrelevant
- <<: *sony
  case_id: sony-spaces
