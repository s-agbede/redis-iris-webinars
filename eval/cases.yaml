    colloquial phrasing.
  filters:
    in_stock_only: true
    categories: [Outerwear & Coats]
  answers: [H00001, H00002, H00007]
  forbidden: []
  expect:
    text: fail
    vector: fail
    hybrid: fail

- case_id: shopper-legs-soaked-hike
  query: bottoms to stop my legs getting soaked on a hike
  why: >-
    DRAFT. Answer is the rain trousers, not a jacket — deliberately pulls the
    set away from H00001 being the answer to nearly everything. Also no
    category facet, so the garment has to be inferred from the query alone.
  filters:
    in_stock_only: true
  answers: [H00009]
  forbidden: []
  expect:
    text: fail
    vector: pass
    hybrid: fail

- case_id: shopper-rains-all-day
  query: what should i wear if it rains all day
  why: >-
    DRAFT. A question rather than a noun phrase, which is how people actually
    talk to an assistant. Shares only the word "rain" with any product copy.
  filters:
    in_stock_only: true
    categories: [Outerwear & Coats]
  answers: [H00001, H00002, H00007]
  forbidden: []
  expect:
    text: fail
    vector: fail
    hybrid: fail
