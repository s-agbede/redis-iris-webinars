# Hero products — hand-written, invented house brands.
#
# WHY THESE EXIST: no real dataset contains the exact near-misses a live demo
# needs. Every product below is designed to fail, or succeed, in one specific and
# explainable way against the episode 1 query:
#
#     "waterproof jacket under EUR 150 that's actually in stock"
#
# The brands are invented, which is what makes it safe to state precise technical
# specifications here. Real-brand products in the generated catalogue never carry
# numeric performance claims.
#
# The `demo_role` field is documentation for us — it is not loaded into Redis.

- product_id: H00001
  name: Aldermoor Fell 3-Layer Shell
  brand: Aldermoor
  category: Outerwear & Coats
  price_eur: 139.99
  cost_eur: 61.20
  in_stock: true
  waterproof_mm: 10000
  material: recycled three-layer polyester
  fit: regular
  care: machine wash cold, do not tumble dry
  colours: [slate, moss, black]
  sizes: [XS, S, M, L, XL]
  description: >-
    A three-layer waterproof shell rated to a 10,000mm hydrostatic head with
    fully taped seams and a storm-flapped centre zip. The hood adjusts at the
    rear and the cuffs close with hook-and-loop tabs. Pit zips vent on the climb.
  demo_role: >-
    THE ANSWER. Under budget, in stock, genuinely waterproof, and the only item
    carrying the exact terms "10,000mm" and "hydrostatic". Vector-only search
    buries it; hybrid puts it first.

