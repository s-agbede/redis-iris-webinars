    the seams are stitched rather than taped so it is not built for sustained
    rain.
  demo_role: >-
    THE PLAUSIBLE WRONG ANSWER. Cheap, in stock, and semantically almost
    identical to the query, so vector search loves it and the filters do not
    touch it. Only hybrid demotes it, because it lacks the exact terms. This is
    the item that makes the case for hybrid.

