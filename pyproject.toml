[project]
name = "northwind-context-engine"
version = "0.1.0"
description = "Northwind Outfitters — a context-aware shopping agent built on Redis, one capability per episode."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.15",
    "redisvl>=0.26.0",
    "openai>=2.0",
    "openai-agents>=0.22.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
seed = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
