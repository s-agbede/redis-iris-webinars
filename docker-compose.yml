services:
  redis:
    # Tested Redis 8.6.2; immutable official image digest (supports FT.HYBRID).
    image: redis@sha256:1f073813b641755b70b0200da64131bbeeb4ec5b633ca67772229b49820caafa
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - camera-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  camera-redis-data:
