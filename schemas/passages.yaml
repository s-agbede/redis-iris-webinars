# Camera passages. All three methods search the same bounded search_text.
version: '0.1.0'
index:
  name: camera_passages
  prefix: camera:passage
  storage_type: json
fields:
  - name: product_id
    type: tag
  - name: passage_id
    type: tag
  - name: brand
    type: tag
    attrs:
      case_sensitive: true
      separator: "\u001f"
  - name: field
    type: tag
  - name: text
    type: text
  - name: start
    type: numeric
  - name: end
    type: numeric
  - name: search_text
    type: text
  - name: embedding
    type: vector
    attrs:
      algorithm: flat
      dims: 384
      distance_metric: cosine
      datatype: float32
