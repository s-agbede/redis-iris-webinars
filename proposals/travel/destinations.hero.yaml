  temp_jul_c: 26
  flight_minutes: 230
  direct_months: [may, jun, jul, aug, sep]
  typical_week_eur: 470
  crowd_level: quiet
  car_needed: false
  walkable: true
  coastal: true
  family_suitable: true
  summary: >-
    A long municipal beach rebuilt after the earthquake, backed by a promenade
    and a working port, with the Anti-Atlas rising an hour inland.
  demo_role: >-
    THE REACHABILITY DECOY, and the only entry that fails on exactly one axis.
    Genuinely warm in February at 20C, quiet, walkable, in budget — and the
    service is summer-only, so it is simply not flyable in February. Isolates
    route seasonality from temperature, which every other decoy in this file
    confounds.

- module_note: >-
    D0011 exists for episode 2, the way H00007 (the petite cut) did in retail.
    It passes every episode 1 constraint and ranks behind Funchal; it becomes
    the answer only when memory recalls the toddler, the crowd aversion, and
    that this customer already did Funchal last February.

