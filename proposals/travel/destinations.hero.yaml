# Hero destinations — the curated layer, hand-picked and photographed.
#
# Same design as seed/heroes.yaml: each entry exists to succeed or fail in one
# specific, explainable way against the episode 1 query:
#
#     "somewhere warm in February, direct from Dublin, not too touristy"
#
# These ~100 sit inside ~2,000-5,000 destinations derived from Wikivoyage, so
# retrieval is doing real work rather than picking from a short list.
#
# Temperatures are REAL. They are the primary near-miss axis, so inventing them
# would break the demo and mislead viewers about actual places.
# `crowd_level`, `car_needed` and `walkable` are editorial judgements — fine to
# author, but they are opinions, not facts, and the copy should read that way.
#
# `demo_role` is documentation for us. Not loaded into Redis.

- destination_id: D0001
  name: Funchal
  region_name: Madeira
  country: Portugal
  macro_region: Atlantic Islands
  temp_feb_c: 18
  temp_jul_c: 25
  flight_minutes: 245
  direct_months: [jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec]
  typical_week_eur: 620
  crowd_level: quiet
  car_needed: false
  walkable: true
  coastal: true
  family_suitable: true
  summary: >-
    A steep, subtropical city stacked above a working harbour, where the
    botanical gardens are reached by cable car and the levada paths start where
    the streets run out. Winter is the growing season; nothing shuts.
  demo_role: >-
    THE ANSWER. Genuinely warm in February, direct, walkable, quiet in winter,
    within budget. The only entry that satisfies every constraint at once.

- destination_id: D0002
  name: Santorini
  region_name: Cyclades
  country: Greece
  macro_region: Mediterranean
  temp_feb_c: 12
  temp_jul_c: 27
  flight_minutes: 245
  direct_months: [may, jun, jul, aug, sep, oct]
  typical_week_eur: 540
  crowd_level: overrun
  car_needed: true
  walkable: false
  coastal: true
  family_suitable: false
  summary: >-
    Whitewashed villages on a caldera rim, blue domes above a drowned volcano,
    and sunsets from Oia that draw a crowd every evening of the season.
  demo_role: >-
    THE SEASONALITY DECOY, and the best near-miss in the set. The prose is
    saturated with warmth and sun, so the embedding ranks it top for "somewhere
    warm" — and February averages 12C with half the island closed. A photo makes
    it look even more correct. ONLY the temperature filter catches this, which
    is the cleanest possible proof that constraints do not live in embeddings.

- destination_id: D0003
  name: Lisbon
  region_name: Lisboa
  country: Portugal
  macro_region: Southern Europe
  temp_feb_c: 14
  temp_jul_c: 28
  flight_minutes: 165
  direct_months: [jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec]
  typical_week_eur: 480
  crowd_level: busy
  car_needed: false
  walkable: true
  coastal: true
  family_suitable: true
  summary: >-
    Seven hills of tiled facades and tram wires above the Tejo, with a
    restaurant scene that has outgrown the tourist strips and a light that
    photographers keep coming back for.
  demo_role: >-
    THE ALMOST-RIGHT ANSWER. Direct, cheap, walkable, lovely — and 14C, which is
    mild rather than warm. The trap a real shopper falls into, and the reason
    the boundary on the temperature filter has to be argued rather than assumed.
    Ranks highly in every mode; only the filter threshold separates it.

